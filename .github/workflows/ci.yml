name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mallplaza
          POSTGRES_PASSWORD: mallplaza_dev
          POSTGRES_DB: mallplaza_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mallplaza"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Preparar variables de prueba (solo valores ficticios de desarrollo)
        run: cp backend/.env.test.example backend/.env.test
      - name: Crear base de pruebas
        run: PGPASSWORD=mallplaza_dev psql -h localhost -U mallplaza -d mallplaza_dev -c "CREATE DATABASE mallplaza_test"
      - run: npm --prefix backend ci
      - run: npm run lint
      - run: npm test
      - run: npm --prefix frontend ci
      - run: npm run build:frontend
