services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: mallplaza
      POSTGRES_PASSWORD: mallplaza_dev
      POSTGRES_DB: mallplaza_dev
    ports:
      - "5432:5432"
    volumes:
      - mallplaza-postgres:/var/lib/postgresql/data
      - ./db/docker-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mallplaza -d mallplaza_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  mallplaza-postgres:
